<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Blog</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/marked.umd.min.js"></script>
</head>
<body>
    <div class="main-layout"> 
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Aiym</h2>
            </div>
            <ul id="post-list">
                </ul>
        </aside>
        <main class="content">
            <div id="post-header">
                <h5 id="post-title"></h5>
                <p id="post-date"></p>
            </div>
            <div id="post-progress-bar-container">
                <div id="post-progress-bar"></div>
            </div>
            <article id="post-body">
                </article>
        </main>
    </div>
     <div class="bat-icon"></div>

    <script src="js/script.js"></script>
</body>
</html>
